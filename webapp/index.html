<!doctype html>
<html lang="zh-CN" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#0f1216" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>焊接助手</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Boot-error banner: release WebView logs JS errors nowhere visible
         (no remote debugging, no console->logcat), so surface them on screen.
         Removed by the app as soon as render succeeds. -->
    <script>
      (function () {
        var shown = false;
        var show = function (msg) {
          var el = document.getElementById('app');
          if (el && !el.childElementCount) {
            shown = true;
            var box = document.createElement('pre');
            box.style.cssText =
              'color:#f66;font:12px monospace;padding:16px;white-space:pre-wrap;';
            box.textContent = 'BOOT ERROR: ' + msg;
            el.appendChild(box);
          }
        };
        window.addEventListener('error', function (e) {
          show((e.message || 'script error') + '\n' + (e.filename || '') + ':' + (e.lineno || ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          show('promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
        });
        // clear only a banner we wrote ourselves -- textContent='' would wipe
        // React's freshly rendered DOM
        window.__bootOk = function () {
          var el = document.getElementById('app');
          if (el && shown) el.textContent = '';
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
